</style></head><body><div id="app"></div><script>
const URL='https://qazejhlwfxfbxxrpbvcf.supabase.co',KEY='sb_publishable_JkmNx4pmhhVayYOQx2gRlw_4hExgxfs';
const tabs=[['schedule','📅','Jadwal'],['about','🌸','Tentang Kita'],['wishlist','✨','Wishlist'],['important_date','🎂','Tanggal Penting'],['date_idea','🎲','Ide Kencan'],['gift','🎁','Hadiah'],['memory','📸','Kenangan']];
const state={tab:'schedule',person:'Aiya',session:null,couple:null,members:[],entries:[],photos:[],photoError:'',error:'',message:'',idea:0,editing:null,publicGallery:true};
const ideas=['Ke kafe baru yang belum pernah didatangi','Ke toko buku, saling pilihkan buku','Piknik sore sambil lihat matahari terbenam','Masak menu baru berdua','Photo booth dengan pose paling konyol','Jalan pagi dan sarapan bareng','Movie night dengan camilan favorit','Tulis surat untuk dibuka tahun depan'];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'';
function api(path,opts={}){const headers={'apikey':KEY,'Content-Type':'application/json',...opts.headers};if(state.session?.access_token)headers.Authorization='Bearer '+state.session.access_token;return fetch(URL+path,{...opts,headers}).then(async r=>{let raw=await r.text(),data=raw?JSON.parse(raw):null;if(!r.ok)throw Error(data?.msg||data?.error_description||data?.message||'Kesalahan '+r.status);return data})}
function storageUrl(path){return URL+'/storage/v1/object/public/kenangan/'+path.split('/').map(encodeURIComponent).join('/')}
async function photoApi(path,opts={}){const headers={apikey:KEY,...opts.headers};if(state.session?.access_token)headers.Authorization='Bearer '+state.session.access_token;const response=await fetch(URL+path,{...opts,headers});if(!response.ok){const body=await response.json().catch(()=>({}));throw Error(body.message||body.error||'Gagal mengakses penyimpanan foto')}return response}
async function loadPhotos(){try{state.photos=await api('/rest/v1/memory_photos?select=id,couple_id,title,caption,taken_on,storage_path,created_at&order=created_at.desc');state.photoError=''}catch(e){state.photoError='Galeri belum tersedia. Konfigurasi tabel dan Storage Supabase terlebih dahulu.';state.photos=[]}}
function gallery(){return `<section class="card"><h2>📸 Galeri Kenangan Kita</h2><p class="muted">Momen kecil yang ingin kita ingat selamanya ♡</p>${state.photoError?`<div class="notice">${esc(state.photoError)}</div>`:''}${state.photos.length?`<div class="gallery">${state.photos.map(p=>`<figure class="photo-card"><img src="${esc(storageUrl(p.storage_path))}" alt="${esc(p.title)}" loading="lazy" data-view="${p.id}"><figcaption class="photo-copy"><strong>${esc(p.title)}</strong>${p.taken_on?`<span class="muted">${esc(fmt(p.taken_on))}</span>`:''}${p.caption?`<p>${esc(p.caption)}</p>`:''}${state.session&&state.members.some(m=>m.user_id===state.session.user.id&&m.couple_id===p.couple_id)?`<div class="photo-actions"><button class="btn outline sm" data-photo-del="${p.id}">Hapus foto</button></div>`:''}</figcaption></figure>`).join('')}</div>`:'<div class="empty">Belum ada foto. Kita mulai mengabadikan cerita, yuk ♡</div>'}</section>`}
function uploadForm(){return `<section class="card"><h2>💕 Tambah Foto Kenangan</h2><form id="photo-form"><div class="field"><label for="photo-file">Pilih foto</label><input id="photo-file" type="file" name="photo" accept="image/jpeg,image/png,image/webp,image/gif" required></div><div class="field"><label>Judul kenangan</label><input name="title" maxlength="140" required placeholder="Hari paling bahagia..."></div><div class="field"><label>Tanggal (opsional)</label><input name="taken_on" type="date"></div><div class="field"><label>Cerita singkat (opsional)</label><textarea name="caption" maxlength="1500" placeholder="Ceritakan momen ini..."></textarea></div><p class="upload-help">JPG, PNG, WebP atau GIF, maksimal 8 MB. Foto akan terlihat oleh semua pengunjung.</p><button class="btn" type="submit">Upload Kenangan ♡</button></form></section>`}
function publicView(){return `<main class="shell"><header class="hero"><div class="avatar">💕</div><h1>Kita Berdua</h1><p class="sub">aiya & denan · cerita yang kita simpan</p></header>${gallery()}<div class="public-link"><button class="btn outline" data-action="go-login">Masuk sebagai Aiya / Denan</button></div><p class="footer">Made with love ♡</p></main>`}
function flash(s,bad=false){state.message=s;state.error=bad?'bad':'';render();setTimeout(()=>{if(state.message===s){state.message='';render()}},4500)}
function loginView(){return `<main class="login"><div class="hero"><div class="avatar">💕</div><h1>Kita Berdua</h1><p class="sub">ruang kecil untuk cerita kita</p></div><section class="card"><h2>Masuk dulu, sayang ♡</h2><form id="login"><div class="field"><label>Email</label><input name="email" type="email" autocomplete="username" required placeholder="Email kamu"></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required placeholder="Password"></div><button class="btn" style="width:100%">Masuk ke ruang kita</button></form></section><p class="footer">Hanya untuk Aiya & Denan ♡</p></main>`}
function header(){let days=state.couple?.anniversary_date?Math.max(0,Math.floor((Date.now()-new Date(state.couple.anniversary_date+'T00:00:00').getTime())/86400000)):0;return `<div class="topbar"><span class="muted">${esc(state.session?.user?.email||'')}</span><button class="btn outline sm" data-action="logout">Keluar</button></div><header class="hero"><div class="avatar">💑</div><h1>Kita Berdua</h1><p class="sub">aiya & denan</p><div class="count">💗 Bersama selama <strong>${days} hari</strong></div></header><nav class="nav">${tabs.map(([id,icon,name])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}">${icon} ${name}</button>`).join('')}</nav>`}
function fields(cat){const common=`<div class="field"><label>${cat==='memory'?'Judul kenangan':cat==='schedule'?'Kegiatan':cat==='wishlist'?'Tempat atau kegiatan':cat==='important_date'?'Nama momen':cat==='gift'?'Ide hadiah':'Judul'}</label><input name="title" maxlength="140" required placeholder="Tulis di sini..."></div>`;const date=['schedule','important_date','memory'].includes(cat)?`<div class="grid"><div class="field"><label>Tanggal</label><input name="event_date" type="date"></div>${cat==='schedule'?'<div class="field"><label>Jam</label><input name="event_time" type="time"></div>':''}</div>`:'';const loc=['schedule','wishlist'].includes(cat)?'<div class="field"><label>Lokasi (opsional)</label><input name="location" placeholder="Tempat tujuan"></div>':'';const desc=cat==='memory'?'Cerita kita':cat==='gift'?'Catatan hadiah':'Catatan (opsional)';return common+date+loc+`<div class="field"><label>${desc}</label><textarea name="description" placeholder="Tulis sesuatu..."></textarea></div>`}
function list(cat){const e=state.entries.filter(e=>e.category===cat).sort((a,b)=>(a.event_date||'').localeCompare(b.event_date||''));return e.length?e.map(x=>`<article class="item"><div class="itemhead"><div><strong>${esc(x.title)}</strong><div class="muted">${[fmt(x.event_date),x.event_time?.slice(0,5),x.location].filter(Boolean).map(esc).join(' · ')}</div></div><div class="actions"><button class="btn outline sm" data-edit="${x.id}" aria-label="Edit">✎</button><button class="btn outline sm" data-del="${x.id}" aria-label="Hapus">×</button></div></div>${x.description?`<p style="white-space:pre-wrap;margin-bottom:0">${esc(x.description)}</p>`:''}</article>`).join(''):'<div class="empty">Belum ada cerita di sini. Yuk mulai bersama ♡</div>'}
function entrySection(cat,heading,listing){return `<section class="card"><h2>${heading}</h2><form id="entry-form" data-category="${cat}">${fields(cat)}<button class="btn" type="submit">Simpan</button></form></section><section class="card"><h2>${listing}</h2>${list(cat)}</section>`}
function about(){return `<section class="card"><h2>💞 Kita</h2><div class="field"><label>Tanggal jadian</label><input value="${esc(state.couple?.anniversary_date||'')}" type="date" id="anniversary"></div><button class="btn sm" data-action="anniversary">Simpan tanggal</button></section><section class="card"><div class="tabs">${['Aiya','Denan'].map(p=>`<button data-person="${p}" class="${state.person===p?'active':''}">${p.toLowerCase()}</button>`).join('')}</div><div style="padding-top:16px"><h2>💕 ${state.person}</h2><p class="muted">Profil singkat dan hal-hal favorit</p><form id="profile-form"><div class="field"><label>Nama / panggilan</label><input name="display_name" value="${esc(state.members.find(m=>m.display_name?.toLowerCase()===state.person.toLowerCase())?.display_name||state.person)}" readonly></div><div class="field"><label>Hobi (pisahkan dengan koma)</label><textarea name="hobbies" placeholder="Makan, kucing, jalan-jalan">${esc(state.entries.find(x=>x.category==='date_idea'&&x.title==='hobbies:'+state.person)?.description||'')}</textarea></div><button class="btn">Simpan hobi</button></form></div></section>`}
function idea(){return `<section class="card"><h2>🎲 Bingung mau kencan ke mana?</h2><p class="muted">Tekan tombol, biarkan nasib memilih.</p><div class="idea">${esc(ideas[state.idea])}</div><div class="actions"><button class="btn" data-action="idea-save">Masukkan ke wishlist</button><button class="btn outline" data-action="idea-next">🎲 Acak ide</button></div></section>`}
function page(){switch(state.tab){case 'about':return about();case 'date_idea':return idea();case 'schedule':return entrySection('schedule','Tambah rencana','Rencana kita');case 'wishlist':return entrySection('wishlist','Mau kita datangi / lakukan','Wishlist kita');case 'important_date':return entrySection('important_date','Tambah tanggal spesial','Tanggal penting kita');case 'gift':return entrySection('gift','Tambah ide hadiah','Daftar hadiah');case 'memory':return uploadForm()+gallery()+entrySection('memory','Tambah cerita tanpa foto','Linimasa kita')}}
function render(){const logged=!!state.session;$('#app').innerHTML=logged?`<main class="shell">${header()}${state.message?`<div class="status ${state.error}">${esc(state.message)}</div>`:''}${state.couple?page():'<section class="card"><h2>Ruang pasangan belum terhubung</h2><p>Login berhasil, tetapi akun ini belum tercatat dalam couple_members. Periksa SQL penghubung Aiya dan Denan.</p></section>'}<p class="footer">Made with love ♡ Aiya & Denan</p></main>`:state.publicGallery?publicView():loginView();bind();bindPhotos();const go=$('[data-action="go-login"]');if(go)go.onclick=()=>{state.publicGallery=false;render()}}
async function uploadPhoto(form){const file=form.elements.namedItem('photo').files[0];if(!file)throw Error('Pilih foto terlebih dahulu');if(!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type))throw Error('Format foto tidak didukung');if(file.size>8*1024*1024)throw Error('Foto maksimal 8 MB');const extension={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'}[file.type];const path=state.couple.id+'/'+crypto.randomUUID()+'.'+extension;await photoApi('/storage/v1/object/kenangan/'+path,{method:'POST',headers:{'Content-Type':file.type,'x-upsert':'false'},body:file});try{await api('/rest/v1/memory_photos',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({couple_id:state.couple.id,storage_path:path,title:formValue(form,'title'),taken_on:formValue(form,'taken_on'),caption:formValue(form,'caption')})})}catch(e){await photoApi('/storage/v1/object/kenangan/'+path,{method:'DELETE'}).catch(()=>{});throw e}}
async function deletePhoto(id){const photo=state.photos.find(p=>p.id===id);if(!photo||!state.couple||photo.couple_id!==state.couple.id)return;if(!confirm('Hapus foto kenangan ini secara permanen?'))return;try{await photoApi('/storage/v1/object/kenangan/'+photo.storage_path,{method:'DELETE'});await api('/rest/v1/memory_photos?id=eq.'+encodeURIComponent(id),{method:'DELETE'});await loadPhotos();flash('Foto berhasil dihapus ♡')}catch(e){flash(e.message,true)}}
function bindPhotos(){document.querySelectorAll('[data-photo-del]').forEach(b=>b.onclick=()=>deletePhoto(b.dataset.photoDel));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const p=state.photos.find(x=>x.id===b.dataset.view);if(!p)return;const overlay=document.createElement('div');overlay.className='viewer';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-label','Lihat foto');const img=document.createElement('img');img.src=storageUrl(p.storage_path);img.alt=p.title;const close=document.createElement('button');close.className='btn';close.textContent='Tutup ×';close.onclick=()=>overlay.remove();overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};overlay.append(img,close);document.body.append(overlay);close.focus()});const form=$('#photo-form');if(form)form.onsubmit=async e=>{e.preventDefault();const btn=form.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Mengunggah foto...';try{await uploadPhoto(form);await loadPhotos();flash('Foto kenangan berhasil ditambahkan ♡')}catch(err){flash(err.message,true)}}}
async function load(){try{const memberships=await api('/rest/v1/couple_members?select=couple_id,display_name,user_id&user_id=eq.'+encodeURIComponent(state.session.user.id));if(!memberships?.length){state.couple=null;render();return}const id=memberships[0].couple_id;const [couples,members,entries]=await Promise.all([api('/rest/v1/couples?select=*&id=eq.'+id),api('/rest/v1/couple_members?select=couple_id,display_name,user_id&couple_id=eq.'+id),api('/rest/v1/entries?select=*&couple_id=eq.'+id+'&order=created_at.desc')]);state.couple=couples[0]||null;state.members=members||[];state.entries=entries||[];render()}catch(e){flash(e.message,true)}}
async function refresh(){if(!state.session?.refresh_token)return;try{const s=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:state.session.refresh_token})});state.session=s;localStorage.setItem('kb_session',JSON.stringify(s))}catch(e){state.session=null;localStorage.removeItem('kb_session')}}
function formValue(form,name){return form.elements.namedItem(name)?.value?.trim()||null}
async function add(cat,title,description=null){await api('/rest/v1/entries',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({couple_id:state.couple.id,category:cat,title,description})});await load()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{state.person=b.dataset.person;render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Hapus item ini?'))return;try{await api('/rest/v1/entries?id=eq.'+b.dataset.del,{method:'DELETE'});await load()}catch(e){flash(e.message,true)}});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const x=state.entries.find(e=>e.id===b.dataset.edit);if(!x)return;state.tab=x.category;render();const form=$('#entry-form');if(!form)return;for(const k of ['title','description','event_date','event_time','location'])if(form.elements.namedItem(k))form.elements.namedItem(k).value=x[k]||'';form.dataset.editing=x.id;form.scrollIntoView({behavior:'smooth',block:'center'})});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{try{switch(b.dataset.action){case 'logout':state.session=null;state.couple=null;localStorage.removeItem('kb_session');render();break;case 'idea-next':state.idea=(state.idea+1+Math.floor(Math.random()*(ideas.length-1)))%ideas.length;render();break;case 'idea-save':await add('wishlist',ideas[state.idea]);flash('Ide ditambahkan ke wishlist ♡');break;case 'anniversary':await api('/rest/v1/couples?id=eq.'+state.couple.id,{method:'PATCH',body:JSON.stringify({anniversary_date:$('#anniversary').value||null})});state.couple.anniversary_date=$('#anniversary').value;flash('Tanggal disimpan ♡');break}}catch(e){flash(e.message,true)}});const login=$('#login');if(login)login.onsubmit=async e=>{e.preventDefault();let btn=login.querySelector('button');btn.disabled=true;try{let s=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:formValue(login,'email'),password:formValue(login,'password')})});state.session=s;localStorage.setItem('kb_session',JSON.stringify(s));render();await load()}catch(err){alert('Gagal masuk: '+err.message);btn.disabled=false}};const entry=$('#entry-form');if(entry)entry.onsubmit=async e=>{e.preventDefault();let b=entry.querySelector('button');b.disabled=true;const data={title:formValue(entry,'title'),description:formValue(entry,'description'),event_date:formValue(entry,'event_date'),event_time:formValue(entry,'event_time'),location:formValue(entry,'location')};try{if(entry.dataset.editing){await api('/rest/v1/entries?id=eq.'+entry.dataset.editing,{method:'PATCH',body:JSON.stringify(data)})}else await api('/rest/v1/entries',{method:'POST',body:JSON.stringify({...data,category:entry.dataset.category,couple_id:state.couple.id})});await load();flash('Tersimpan untuk kita berdua ♡')}catch(err){flash(err.message,true);b.disabled=false}};const profile=$('#profile-form');if(profile)profile.onsubmit=async e=>{e.preventDefault();const title='hobbies:'+state.person,description=formValue(profile,'hobbies');try{const current=state.entries.find(x=>x.category==='date_idea'&&x.title===title);if(current)await api('/rest/v1/entries?id=eq.'+current.id,{method:'PATCH',body:JSON.stringify({description})});else await add('date_idea',title,description);await load();flash('Hobi tersimpan ♡')}catch(err){flash(err.message,true)}}}
async function init(){try{state.session=JSON.parse(localStorage.getItem('kb_session')||'null')}catch{}if(state.session)await refresh();await loadPhotos();if(state.session)await load();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{})}init();
</script></body></html>
