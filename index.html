<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff1f4" />
    <meta name="description" content="Ruang cerita Aiya dan Denan" />

  <body>
    <div id="app"><p class="boot">Memuat…</p></div>

    <!-- Notifikasi singkat (berhasil / gagal) -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Pemilih file untuk ganti foto profil (dipakai bersama) -->
    <input type="file" id="photo-picker" accept="image/*" hidden />

    <!-- Kamera untuk PAP harian (langsung buka kamera depan di HP) -->
    <input type="file" id="snap-picker" accept="image/*" capture="user" hidden />

    <script src="/app.js" defer></script>
  </body>
